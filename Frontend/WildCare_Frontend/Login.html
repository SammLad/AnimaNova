<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WildCare | Iniciar Sesión</title>
  <!-- Vinculo con tu archivo CSS independiente -->
  <link rel="stylesheet" href="./src/assets/styles/login.css" />
</head>

<body>
  <div class="login-container">
    <div class="logo-flower mb-2"></div>
    <h2>WildCare</h2>
    <p class="subtitle">Ingresa tus datos para continuar</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="Usuario" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required
          autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div class="login-footer">
      <a href="index.html">← Volver al inicio</a>
    </div>
  </div>

  <!-- Vinculo con tu JS independiente en Vite -->
  <script type="module" src="./src/login.jsx"></script>
</body>

</html>
